# SQL Server for local development only. The password below is a throwaway local
# placeholder - never commit a real credential.
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: supportdesk-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-Local_Dev_Password1}"
      MSSQL_PID: Developer
    ports:
      - "127.0.0.1:1433:1433"
    volumes:
      - supportdesk-sql:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  api:
    image: northwind-support-api:local
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "127.0.0.1:5080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: "${ASPNETCORE_ENVIRONMENT:-Development}"
      ConnectionStrings__Default: "Server=sqlserver,1433;Database=SupportDesk;User Id=sa;Password=${MSSQL_SA_PASSWORD:-Local_Dev_Password1};TrustServerCertificate=True;Encrypt=False"
      Jwt__SigningKey: "${Jwt__SigningKey:?Generate a signing key in .env; see README}"
      Jwt__Issuer: "${Jwt__Issuer:-NorthwindSupport}"
      Jwt__Audience: "${Jwt__Audience:-NorthwindSupportWeb}"
      Jwt__LifetimeMinutes: "${Jwt__LifetimeMinutes:-60}"
      Sla__BaseWindowHours__Low: "${SLA_LOW_HOURS:-72}"
      Sla__BaseWindowHours__Medium: "${SLA_MEDIUM_HOURS:-24}"
      Sla__BaseWindowHours__High: "${SLA_HIGH_HOURS:-8}"
      Sla__BaseWindowHours__Critical: "${SLA_CRITICAL_HOURS:-4}"
      Sla__PremiumCustomerMultiplier: "${SLA_PREMIUM_MULTIPLIER:-0.5}"
      Sla__MinimumWindowHours: "${SLA_MINIMUM_HOURS:-1}"
      Sla__AtRiskThresholdPercent: "${SLA_AT_RISK_PERCENT:-25}"
    depends_on:
      sqlserver:
        condition: service_healthy

volumes:
  supportdesk-sql:
